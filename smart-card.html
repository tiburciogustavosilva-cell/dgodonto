<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <title>DG Odontologia | Cartão digital</title>
    <meta name="description" content="Cartão digital da DG Odontologia. Agende sua consulta, fale pelo WhatsApp e veja como chegar na Asa Norte, Brasília." />

    <link rel="icon" href="assets/logo-dg.png" />
    <link rel="apple-touch-icon" href="assets/logo-dg.png" />

    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&display=swap" rel="stylesheet" />
    <style>
      /* ============================================================
         DG Odontologia — Cartão digital
         Mesmos tokens da LP (styles.css): dourado #B6932F, hover #927426,
         fundos #FFFFFF / #F7F7F7, texto #333333, Geist, botões em pílula.

         Tudo cabe em uma tela: o cartão tem a altura da tela e a foto
         de capa (flex: 1) ocupa só o espaço que sobra do conteúdo.
         ============================================================ */
      :root {
        color-scheme: light;

        --bg: #ffffff;
        --bg-alt: #f7f7f7;
        --ink: #333333;
        --ink-soft: #5f5f5f;
        --line: rgb(51 51 51 / 0.12);
        --accent: #b6932f;
        --accent-hover: #927426;
        --accent-ink: #84681f;
        --on-accent: #ffffff;
        --shadow: 0 24px 60px -32px rgb(51 51 51 / 0.4);

        --font: "Geist", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --r: 8px;
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
        --gap: clamp(0.75rem, 2.2vh, 1.25rem);
        --pad-x: 1.25rem;
      }

      *, *::before, *::after { box-sizing: border-box; }
      * { margin: 0; padding: 0; }

      body {
        font-family: var(--font); font-size: 1rem; line-height: 1.5;
        color: var(--ink); background: var(--bg-alt);
        -webkit-font-smoothing: antialiased; overflow-x: clip;
        display: flex; justify-content: center; align-items: center;
        min-height: 100vh; min-height: 100dvh;
      }

      img, svg { display: block; max-width: 100%; }
      a { color: inherit; text-decoration: none; }
      ul { list-style: none; }
      button { font: inherit; color: inherit; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }


      .eyebrow {
        font-size: 0.7rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.14em;
        color: var(--accent-ink);
      }

      /* ---------- Cartão ---------- */
      .card {
        width: 100%; max-width: 440px; background: var(--bg);
        height: 100vh; height: 100dvh;
        display: flex; flex-direction: column;
        padding-bottom: env(safe-area-inset-bottom);
      }
      @media (min-width: 480px) {
        .card {
          height: min(100dvh - 3rem, 860px);
          border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--line);
        }
      }

      .cover { position: relative; flex: 1 1 auto; min-height: 88px; max-height: 55vh; background: var(--bg-alt); overflow: hidden; }
      .cover img { width: 100%; height: 100%; object-fit: cover; object-position: 55% 35%; }
      .cover::after {
        content: ""; position: absolute; inset: auto 0 0; height: 45%;
        background: linear-gradient(to top, rgb(255 255 255 / 0.9), transparent);
      }

      .identity { flex: none; padding: 0 var(--pad-x); text-align: center; position: relative; z-index: 1; }
      .identity__logo {
        --size: clamp(76px, 12vh, 100px);
        width: var(--size); height: var(--size); margin: calc(var(--size) / -2) auto 0; border-radius: 50%;
        background: var(--bg); border: 1px solid var(--line); box-shadow: var(--shadow);
        display: grid; place-items: center;
      }
      .identity__logo img { width: 75%; height: auto; }
      .identity .eyebrow { margin-top: clamp(0.6rem, 1.6vh, 1rem); }

      .body {
        flex: none; padding: var(--gap) var(--pad-x) 0;
        display: grid; gap: var(--gap);
      }

      /* ---------- Botões (iguais à LP) ---------- */
      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
        min-height: 3rem; padding: 0 1.6rem; border-radius: 999px; border: 1px solid transparent;
        font-weight: 600; font-size: 0.975rem; white-space: nowrap; cursor: pointer; background: none;
        transition: transform 0.3s var(--ease), background-color 0.3s var(--ease), border-color 0.3s var(--ease), color 0.3s var(--ease);
      }
      .btn:active { transform: translateY(1px) scale(0.98); }
      .btn svg { width: 18px; height: 18px; flex: none; }
      .btn--primary { background: var(--accent); color: var(--on-accent); }
      .btn--primary:hover { background: var(--accent-hover); }
      .btn--ghost { border-color: var(--line); color: var(--ink); }
      .btn--ghost:hover { border-color: var(--accent); color: var(--accent-ink); }
      .btn--sm { min-height: 2.5rem; padding: 0 0.9rem; font-size: 0.875rem; }

      .cta { display: grid; gap: 0.5rem; }
      .cta .btn { width: 100%; }
      .cta__row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }

      /* ---------- Atalhos (ícones) ---------- */
      .shortcuts { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 0.5rem; }      .shortcuts a { display: grid; justify-items: center; gap: 0.35rem; font-size: 0.75rem; color: var(--ink-soft); }
      .shortcuts__ico {
        width: 46px; height: 46px; border-radius: 50%;
        display: grid; place-items: center; background: var(--bg-alt); color: var(--accent);
        transition: background-color 0.3s var(--ease), color 0.3s var(--ease), transform 0.3s var(--ease);
      }
      .shortcuts__ico svg { width: 20px; height: 20px; }
      .shortcuts a:hover .shortcuts__ico { background: var(--accent); color: var(--on-accent); transform: translateY(-2px); }
      .shortcuts a:hover { color: var(--accent-ink); }

      /* ---------- Informações ---------- */
      .info {
        padding: 0.85rem 1rem; border-radius: var(--r); background: var(--bg-alt);
        display: grid; gap: 0.55rem; font-size: 0.825rem; line-height: 1.4; color: var(--ink-soft);
      }
      .info li { display: flex; gap: 0.6rem; align-items: flex-start; }
      .info svg { flex: none; width: 16px; height: 16px; margin-top: 1px; color: var(--accent); }
      .info strong { color: var(--ink); font-weight: 500; }

      .foot { flex: none; padding: var(--gap) var(--pad-x); text-align: center; font-size: 0.75rem; color: var(--ink-soft); }

      .toast {
        position: fixed; left: 50%; bottom: 1.25rem; translate: -50% 1rem;
        padding: 0.6rem 1.1rem; border-radius: 999px; background: var(--ink); color: #fff;
        font-size: 0.875rem; opacity: 0; pointer-events: none;
        transition: opacity 0.3s var(--ease), translate 0.3s var(--ease);
      }
      .toast.is-visible { opacity: 1; translate: -50% 0; }

      /* Telas bem baixas (ex.: iPhone SE 1ª geração): compacta mais */
      @media (max-height: 600px) {
        :root { --gap: 0.6rem; }
        .btn { min-height: 2.75rem; }
        .btn--sm { min-height: 2.25rem; }
        .shortcuts__ico { width: 40px; height: 40px; }
        .info li:nth-child(2) { display: none; }
      }
      @media (max-width: 340px) {
        :root { --pad-x: 1rem; }
        .btn--sm { font-size: 0.8rem; padding: 0 0.6rem; }
      }

      /* ---------- Movimento ---------- */
      @media (prefers-reduced-motion: no-preference) {
        .enter { animation: rise 0.9s var(--ease) both; animation-delay: calc(var(--i) * 80ms + 100ms); }
        .cover img { animation: unveil 1.3s var(--ease) both; }
      }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
      @keyframes unveil { from { clip-path: inset(100% 0 0 0); } to { clip-path: inset(0 0 0 0); } }
    </style>
  </head>
  <body>
    <main class="card">
      <figure class="cover">
        <img src="assets/hero-consulta.jpg" alt="" width="1600" height="1200" fetchpriority="high" decoding="async" />
      </figure>

      <header class="identity">
        <div class="identity__logo enter" style="--i: 0">
          <img src="assets/logo-dg.png" alt="DG Odontologia" width="256" height="256" />
        </div>
        <p class="eyebrow enter" style="--i: 1">Clínica odontológica · Asa Norte</p>
      </header>

      <div class="body">
        <div class="cta enter" style="--i: 4">
          <a class="btn btn--primary" data-link="whatsapp" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
            Agendar consulta
          </a>
          <div class="cta__row">
            <button class="btn btn--ghost btn--sm" id="salvarContato" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
              Salvar contato
            </button>
            <button class="btn btn--ghost btn--sm" id="compartilhar" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
              Compartilhar
            </button>
          </div>
        </div>

        <nav class="shortcuts enter" style="--i: 5" aria-label="Contatos">
          <a data-link="instagram" target="_blank" rel="noopener noreferrer">
            <span class="shortcuts__ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/></svg></span>
            Instagram
          </a>
          <a href="/">
            <span class="shortcuts__ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></span>
            Site
          </a>
          <a data-link="mapa" id="linkMapa" target="_blank" rel="noopener noreferrer">
            <span class="shortcuts__ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></span>
            Mapa
          </a>
          <a data-link="facebook" id="linkFacebook" target="_blank" rel="noopener noreferrer">
            <span class="shortcuts__ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg></span>
            Facebook
          </a>
        </nav>

        <ul class="info enter" style="--i: 6">
          <!-- TODO: confirmar endereço completo (bloco/sala) com a clínica -->
          <li>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <span><strong>Edifício Jaime Leal</strong> · Asa Norte, Brasília - DF</span>
          </li>
          <li>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/></svg>
            <span>Ortodontia · Alinhadores · Implantes · Estética · Bruxismo · Clínica geral</span>
          </li>
        </ul>
      </div>

      <footer class="foot">© <span id="anoAtual">2026</span> DG Odontologia · Convênios e parcelamento</footer>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      (function () {
        "use strict";

        /* Dados da clínica: edite aqui */
        var CLINICA = {
          nome: "DG Odontologia",
          whatsapp: "556181386671",
          instagram: "dgodontodf",
          facebook: "",   // TODO: link completo da página (https://www.facebook.com/...). Vazio = abre a busca no Facebook
          endereco: "Edifício Jaime Leal - Asa Norte, Brasília - DF",
          mensagem: "Olá! Vim pelo cartão digital e gostaria de agendar uma consulta."
        };

        var end = encodeURIComponent(CLINICA.endereco);

        /* Mapa: um link só, e o aparelho escolhe o app.
           Android: "geo:" abre a lista de apps de mapa instalados (Google Maps, Waze...).
           iPhone/iPad: abre o app de mapas do sistema.
           Computador: Google Maps no navegador. */
        var ua = navigator.userAgent;
        var isAndroid = /Android/i.test(ua);
        var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        var mapa = isAndroid ? "geo:0,0?q=" + end
          : isIOS ? "https://maps.apple.com/?q=" + end
          : "https://www.google.com/maps/search/?api=1&query=" + end;

        var links = {
          whatsapp: "https://wa.me/" + CLINICA.whatsapp + "?text=" + encodeURIComponent(CLINICA.mensagem),
          instagram: "https://www.instagram.com/" + CLINICA.instagram + "/",
          facebook: CLINICA.facebook || "https://www.facebook.com/search/top?q=" + encodeURIComponent(CLINICA.nome + " Brasília"),
          mapa: mapa
        };

        document.querySelectorAll("[data-link]").forEach(function (el) { el.href = links[el.dataset.link]; });
        /* No celular o mapa abre direto no app; sem nova aba em branco */
        if (isAndroid || isIOS) document.getElementById("linkMapa").removeAttribute("target");        document.getElementById("anoAtual").textContent = String(new Date().getFullYear());

        var toastEl = document.getElementById("toast");
        var toastTimer;
        function toast(msg) {
          toastEl.textContent = msg;
          toastEl.classList.add("is-visible");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(function () { toastEl.classList.remove("is-visible"); }, 2200);
        }

        /* Baixa um .vcf para o paciente adicionar a clínica aos contatos */
        document.getElementById("salvarContato").addEventListener("click", function () {
          var vcard = [
            "BEGIN:VCARD",
            "VERSION:3.0",
            "FN:" + CLINICA.nome,
            "ORG:" + CLINICA.nome,
            "TEL;TYPE=CELL:+" + CLINICA.whatsapp,
            "ADR;TYPE=WORK:;;Edifício Jaime Leal;Brasília;DF;;Brasil",
            "URL:" + links.instagram,
            "END:VCARD"
          ].join("\r\n");
          var a = document.createElement("a");
          a.href = URL.createObjectURL(new Blob([vcard], { type: "text/vcard;charset=utf-8" }));
          a.download = "DG-Odontologia.vcf";
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
        });

        document.getElementById("compartilhar").addEventListener("click", function () {
          var data = { title: CLINICA.nome, text: "Cartão digital da DG Odontologia", url: location.href };
          if (navigator.share) {
            navigator.share(data).catch(function () {});
          } else if (navigator.clipboard) {
            navigator.clipboard.writeText(location.href).then(
              function () { toast("Link copiado!"); },
              function () { toast("Copie o link na barra do navegador"); }
            );
          } else {
            toast("Copie o link na barra do navegador");
          }
        });
      })();
    </script>
  </body>
