services:

  dgodonto:
    image: aquilacond/dgodonto:latest

    networks:
      - dgodontoNet

    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.dgodonto.rule=Host(`dgodontologia.com.br`) || Host(`www.dgodontologia.com.br`)
        - traefik.http.routers.dgodonto.entrypoints=websecure
        - traefik.http.routers.dgodonto.tls=true
        - traefik.http.services.dgodonto.loadbalancer.server.port=80

    restart: unless-stopped


networks:
  dgodontoNet:
    external: true